name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
      - "release*"
  pull_request:
    branches:
      - main
      - master

jobs:
  windows-exe:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      TARGET: x86_64-pc-windows-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Install MinGW cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Build release EXE
        run: cargo build --release --target $TARGET

      - name: Package Windows binary
        run: |
          mkdir -p artifacts
          cp target/${TARGET}/release/rufus-rs.exe artifacts/
          zip -j rufus-rs-windows-x86_64.zip artifacts/rufus-rs.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rufus-rs-windows-x86_64
          path: rufus-rs-windows-x86_64.zip
          if-no-files-found: error

      - name: Publish GitHub Release for tags
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: rufus-rs-windows-x86_64.zip
